
name: Universal Multi Flashing Tool - Auto ZIP Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Find ZIP, Extract and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find any ZIP file
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -type f -iname '*.zip' \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -print | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No ZIP file found in the repository."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "::error::Multiple ZIP files found. Keep only the project ZIP to avoid building the wrong archive."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Selected ZIP: $ZIP_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/android-project"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "${{ steps.archive.outputs.zip_file }}" \
            -d "$EXTRACT_DIR"

          echo "extract_dir=$EXTRACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.extract.outputs.extract_dir }}"

          mapfile -t SETTINGS < <(
            find "$ROOT" -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -not -path '*/.gradle/*' \
              -print
          )

          if [ "${#SETTINGS[@]}" -eq 0 ]; then
            echo "::error::No Gradle settings file found in ZIP."
            exit 1
          fi

          if [ "${#SETTINGS[@]}" -ne 1 ]; then
            echo "::error::Multiple Gradle projects found. Keep one Android project in the ZIP."
            printf '%s\n' "${SETTINGS[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS[0]}")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app module not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Verify extracted project
        run: |
          set -euo pipefail
          PROJECT="${{ steps.project.outputs.project_dir }}"

          test -f "$PROJECT/gradlew" || true
          test -d "$PROJECT/app/src"

          echo "Android project structure verified."

      - name: Run Android unit tests
        run: |
          gradle -p "${{ steps.project.outputs.project_dir }}" \
            --no-daemon --stacktrace testDebugUnitTest

      - name: Build Debug APK
        run: |
          gradle -p "${{ steps.project.outputs.project_dir }}" \
            --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Multi-Flashing-Tool-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Test-Reports
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/reports/tests/
            ${{ steps.project.outputs.project_dir }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
