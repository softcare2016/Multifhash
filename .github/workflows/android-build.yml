
name: Universal Multi Flashing Tool - Android Build

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.zip'
      - '**/*.yml'
      - '**/*.yaml'
      - 'UniversalMultiFlashingTool/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-flasher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Universal Multi Flashing Tool APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and recursively extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, zipfile, hashlib
          from pathlib import Path

          repo = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          temp = Path(os.environ['RUNNER_TEMP']) / 'umt-recursive-extract'
          temp.mkdir(parents=True, exist_ok=True)
          max_depth = 10
          max_archives = 100
          seen = set()

          def is_project(root: Path):
              for settings in list(root.rglob('settings.gradle.kts')) + list(root.rglob('settings.gradle')):
                  project = settings.parent
                  if ((project / 'app' / 'build.gradle.kts').is_file()
                      or (project / 'app' / 'build.gradle').is_file()):
                      return project
              return None

          project = is_project(repo)

          if project:
              print(f'Found Android project directly in repository: {project}')
          else:
              queue = sorted(p for p in repo.rglob('*.zip')
                             if '.git' not in p.parts and ' .gradle' not in p.parts)
              processed = 0
              level = 0

              while queue and level < max_depth and processed < max_archives and not project:
                  next_queue = []

                  for archive in queue:
                      if processed >= max_archives:
                          break

                      try:
                          raw = archive.read_bytes()
                          digest = hashlib.sha256(raw).hexdigest()

                          if digest in seen:
                              continue

                          seen.add(digest)

                          with zipfile.ZipFile(archive) as zf:
                              bad = zf.testzip()

                              if bad:
                                  print(f'Skipping damaged ZIP {archive}: {bad}')
                                  continue

                              target = temp / f'level-{level}' / digest[:16]
                              target.mkdir(parents=True, exist_ok=True)

                              for info in zf.infolist():
                                  dest = (target / info.filename).resolve()

                                  if dest != target.resolve() and target.resolve() not in dest.parents:
                                      raise RuntimeError(f'Unsafe ZIP path: {info.filename}')

                              zf.extractall(target)

                          processed += 1
                          print(f'Extracted archive level {level}: {archive}')

                          project = is_project(target)

                          if project:
                              break

                          next_queue.extend(target.rglob('*.zip'))

                      except Exception as exc:
                          print(f'WARNING: Could not process {archive}: {exc}')

                  queue = next_queue
                  level += 1

          if not project:
              print('ERROR: Could not find a valid Android Gradle project.')
              print('Expected settings.gradle(.kts) and app/build.gradle(.kts).')
              print('Repository ZIP files:')

              for p in repo.rglob('*.zip'):
                  if '.git' not in p.parts:
                      print(' -', p.relative_to(repo))

              sys.exit(1)

          project = project.resolve()

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PROJECT_DIR={project}\n')

          print(f'PROJECT_DIR={project}')
          PY

      - name: Verify Android project configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f gradle.properties

          echo "Android project structure verified: $PROJECT_DIR"

      - name: Run screen layout verification
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "$PROJECT_DIR/tools/simulation/check_screen_layout.sh" ]]; then
            bash "$PROJECT_DIR/tools/simulation/check_screen_layout.sh"
          else
            echo "Screen layout verification script not found; skipping."
          fi

      - name: Run unit tests
        run: gradle -p "$PROJECT_DIR" testDebugUnitTest --no-daemon --stacktrace --max-workers=2

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace --max-workers=2

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          test -d "$APK_DIR"

          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .

          ls -lh "$APK_DIR"/*.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-multi-flasher-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: universal-flasher-build-diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
