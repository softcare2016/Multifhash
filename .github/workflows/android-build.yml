
name: Universal Multi Flashing Tool - Auto ZIP Build

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract, Test and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -type f -iname '*.zip' \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -print | sort
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "::error::Keep exactly one project ZIP in repository."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          echo "zip_file=${ZIP_FILES[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract Android Project
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/android-project"
          mkdir -p "$EXTRACT_DIR"

          unzip -t "${{ steps.archive.outputs.zip_file }}"
          unzip -q "${{ steps.archive.outputs.zip_file }}" \
            -d "$EXTRACT_DIR"

          mapfile -t SETTINGS < <(
            find "$EXTRACT_DIR" -type f \
              \( -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \) \
              -not -path '*/.gradle/*'
          )

          if [ "${#SETTINGS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Gradle project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS[0]}")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app module not found."
            exit 1
          fi

          test -d "$PROJECT_DIR/app/src"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project successfully extracted."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Project
        run: |
          test -d "$PROJECT_DIR/app/src"
          echo "Project structure verified."

      - name: Run Android Unit Tests
        run: |
          gradle -p "$PROJECT_DIR" \
            --no-daemon --stacktrace testDebugUnitTest

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" \
            --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Multi-Flashing-Tool-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Test-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
