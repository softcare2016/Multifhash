name: Universal Multi Flashing Tool - Android Build

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

env:  
  ANDROID_HOME: /usr/local/lib/android/sdk  
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk  

steps:  
  - name: Checkout Repository  
    uses: actions/checkout@v4  

  # Find the latest ZIP, regardless of its filename  
  - name: Find and Extract Latest Project ZIP  
    shell: bash  
    run: |  
      set -e  

      echo "Searching for ZIP files..."  

      ZIP_FILE=$(find . \  
        -type f \  
        -iname "*.zip" \  
        -not -path "./.git/*" \  
        -not -path "./.github/*" \  
        -printf '%T@ %p\n' \  
        | sort -nr \  
        | head -n 1 \  
        | cut -d' ' -f2-)  

      if [ -z "$ZIP_FILE" ]; then  
        echo "ERROR: No ZIP file found."  
        exit 1  
      fi  

      echo "Selected ZIP: $ZIP_FILE"  

      mkdir -p "$RUNNER_TEMP/android-project"  

      unzip -q "$ZIP_FILE" \  
        -d "$RUNNER_TEMP/android-project"  

      echo "ZIP extraction completed."  

      PROJECT_FILE=$(find "$RUNNER_TEMP/android-project" \  
        -type f \  
        -name "settings.gradle.kts" -o -name "settings.gradle" \  
        | head -n 1)  

      if [ -z "$PROJECT_FILE" ]; then  
        echo "ERROR: Gradle settings file not found."  
        exit 1  
      fi  

      PROJECT_DIR=$(dirname "$PROJECT_FILE")  

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"  

      echo "Detected project: $PROJECT_DIR"  

  # Java 17  
  - name: Set Up Java 17  
    uses: actions/setup-java@v5  
    with:  
      distribution: temurin  
      java-version: "17"  

  # Android SDK  
  - name: Locate Android SDK Tools  
    shell: bash  
    run: |  
      set -e  

      if [ ! -d "$ANDROID_HOME" ]; then  
        echo "ERROR: Android SDK directory not found."  
        exit 1  
      fi  

      SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \  
        -type f \  
        -name sdkmanager \  
        | head -n 1)  

      if [ -z "$SDKMANAGER" ]; then  
        echo "ERROR: sdkmanager not found."  
        exit 1  
      fi  

      echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"  
      echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"  
      echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"  

      echo "Android SDK tools located."  

  - name: Accept Android SDK Licenses  
    shell: bash  
    run: |  
      set -e  
      yes | "$SDKMANAGER" --licenses || true  

  - name: Install Android SDK Packages  
    shell: bash  
    run: |  
      set -e  

      "$SDKMANAGER" --install \  
        "platform-tools" \  
        "platforms;android-35" \  
        "build-tools;35.0.0"  

  # Gradle 8.9  
  - name: Set Up Gradle  
    uses: gradle/actions/setup-gradle@v4  
    with:  
      gradle-version: "8.9"  

  # Verify project without requiring gradlew  
  - name: Verify Android Project  
    shell: bash  
    run: |  
      set -e  

      cd "$PROJECT_DIR"  

      echo "Verifying Android project..."  

      if [ ! -f "settings.gradle.kts" ] && \  
         [ ! -f "settings.gradle" ]; then  
        echo "ERROR: Gradle settings file missing."  
        exit 1  
      fi  

      if [ ! -f "build.gradle.kts" ] && \  
         [ ! -f "build.gradle" ]; then  
        echo "ERROR: Root Gradle build file missing."  
        exit 1  
      fi  

      if [ ! -f "app/build.gradle.kts" ] && \  
         [ ! -f "app/build.gradle" ]; then  
        echo "ERROR: App module build file missing."  
        exit 1  
      fi  

      echo "Gradle wrapper is optional."  
      echo "Using installed Gradle instead."  
      echo "Project verification successful."  

  # Run tests using installed Gradle  
  - name: Run Unit Tests  
    shell: bash  
    run: |  
      set -e  

      cd "$PROJECT_DIR"  

      gradle --version  

      gradle testDebugUnitTest \  
        --no-daemon \  
        --stacktrace  

  # Build APK using installed Gradle  
  - name: Build Debug APK  
    shell: bash  
    run: |  
      set -e  

      cd "$PROJECT_DIR"  

      gradle assembleDebug \  
        --no-daemon \  
        --stacktrace  

  # Upload APK  
  - name: Upload APK  
    if: success()  
    uses: actions/upload-artifact@v4  
    with:  
      name: Universal-Multi-Flashing-Tool-APK  
      path: |  
        ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk  
      if-no-files-found: error  

  # Upload test reports  
  - name: Upload Test Reports  
    if: always()  
    uses: actions/upload-artifact@v4  
    with:  
      name: Android-Test-Reports  
      path: |  
        ${{ env.PROJECT_DIR }}/app/build/reports/tests/  
      if-no-files-found: ignore
