
name: Universal Multi Flashing Tool - Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # FIND ANY ZIP FILE AND EXTRACT ANDROID PROJECT
      # --------------------------------------------------

      - name: Find and Extract Latest Project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for uploaded ZIP files..."

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -printf '%T@ %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Selected ZIP: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/android-project"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/android-project"

          echo "ZIP extracted successfully."

          echo "Searching for Android Gradle project..."

          PROJECT_FILE=$(find "$RUNNER_TEMP/android-project" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android Gradle project not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project detected:"
          echo "$PROJECT_DIR"

      # --------------------------------------------------
      # JAVA SETUP
      # --------------------------------------------------

      - name: Set Up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # ANDROID SDK SETUP
      # --------------------------------------------------

      - name: Locate Android SDK Tools
        shell: bash
        run: |
          set -e

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK tools located successfully."
          echo "$SDKMANAGER"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses || true

      - name: Install Required Android SDK Packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # GRADLE SETUP
      # --------------------------------------------------

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # --------------------------------------------------
      # PROJECT VERIFICATION
      # --------------------------------------------------

      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Verifying Android project..."

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew file not found."
            exit 1
          fi

          chmod +x gradlew

          if [ ! -d "app/src" ]; then
            echo "ERROR: app source directory not found."
            exit 1
          fi

          echo "Project verification successful."

      # --------------------------------------------------
      # UNIT TESTS
      # --------------------------------------------------

      - name: Run Unit Tests
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew testDebugUnitTest \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # BUILD APK
      # --------------------------------------------------

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # UPLOAD APK
      # --------------------------------------------------

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Multi-Flashing-Tool-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # --------------------------------------------------
      # UPLOAD TEST REPORTS
      # --------------------------------------------------

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Test-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/
          if-no-files-found: ignore
