
name: Universal Multi Flashing Tool - Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-flasher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Universal Multi Flashing Tool APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Locate preinstalled Android SDK
      # Do not use setup-android action.
      # It previously attempted to install obsolete "tools".
      - name: Locate Android SDK Tools
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK located."
          echo "SDK Manager: $SDKMANAGER"

      # 4. Accept SDK licenses
      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          echo "SDK license acceptance completed."

      # 5. Install only required Android packages
      # Never install obsolete package named "tools".
      - name: Install Required Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Required Android SDK packages installed."

      # 6. Setup exact Gradle version
      - name: Set Up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Find and extract latest ZIP
      - name: Find and Extract Latest Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for ZIP files..."

          ZIP_FILE=$(
            find . \
              -type f \
              -iname '*.zip' \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -printf '%T@ %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Selected ZIP: $ZIP_FILE"

          PROJECT_ROOT="$RUNNER_TEMP/android-project"

          mkdir -p "$PROJECT_ROOT"

          unzip -t "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d "$PROJECT_ROOT"

          echo "ZIP extraction completed."

          PROJECT_FILE=$(
            find "$PROJECT_ROOT" \
              -type f \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -print -quit
          )

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Detected project: $PROJECT_DIR"

      # 8. Verify project configuration
      - name: Verify Android Project Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Checking Android project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f gradle.properties

          grep -q '8.7.3' build.gradle.kts
          grep -q '2.0.21' build.gradle.kts

          grep -q 'compileSdk = 35' app/build.gradle.kts
          grep -q 'minSdk = 26' app/build.gradle.kts

          echo "Project configuration verified."

      # 9. Verify Java, SDK and Gradle
      - name: Verify Build Environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list_installed

          echo "Build environment verified."

      # 10. Verify screen layout
      - name: Run Screen Layout Verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          bash tools/simulation/check_screen_layout.sh

      # 11. Resolve dependencies with retry
      - name: Resolve Gradle Dependencies
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          for attempt in 1 2 3; do

            echo "Dependency resolution attempt: $attempt"

            if gradle dependencies \
              --no-daemon \
              --stacktrace \
              --max-workers=2; then

              echo "Dependencies resolved successfully."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Retrying dependency resolution..."
              sleep $((attempt * 20))
            fi

          done

          echo "ERROR: Dependency resolution failed."
          exit 1

      # 12. Run unit tests
      - name: Run Unit Tests
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          for attempt in 1 2 3; do

            echo "Unit test attempt: $attempt"

            if gradle testDebugUnitTest \
              --no-daemon \
              --stacktrace \
              --max-workers=2; then

              echo "Unit tests passed."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Retrying unit tests..."
              sleep $((attempt * 15))
            fi

          done

          echo "ERROR: Unit tests failed."
          exit 1

      # 13. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          for attempt in 1 2 3; do

            echo "APK build attempt: $attempt"

            if gradle assembleDebug \
              --no-daemon \
              --stacktrace \
              --max-workers=2; then

              echo "APK build completed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Retrying APK build..."
              sleep $((attempt * 20))
            fi

          done

          echo "ERROR: APK build failed."
          exit 1

      # 14. Verify generated APK
      - name: Verify Generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK directory not found."
            exit 1
          fi

          APK_COUNT=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo "Generated APK files:"

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -exec ls -lh {} \;

      # 15. Upload APK
      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Multi-Flashing-Tool-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 16. Upload unit test reports
      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Flasher-Test-Reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # 17. Upload diagnostic logs
      - name: Upload Build Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Flasher-Build-Diagnostics
          path: |
            /home/runner/.gradle/daemon/
            ${{ env.PROJECT_DIR }}/app/build/reports/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
